{% extends 'base.html' %}
{% block title %}Подтверждение кредита{% endblock %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Подтверждение выдачи кредита</h3>
    <a href="{% url 'britain_credit_issue' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Назад</a>
  </div>
  <div class="card"><div class="card-body">
    <p>Игрок: <strong>{{ credit.player_id }}</strong></p>
    <p>Сумма: <strong>{{ credit.amount }}</strong></p>
    <p>Срок: <strong>{{ credit.term }}</strong></p>
    <p>Ежемесячный платеж: <strong>{{ credit.monthly }}</strong></p>
    <form method="post">{% csrf_token %}<button class="btn btn-primary" type="submit">Подтвердить</button></form>
  </div></div>
</div>
{% endblock %}
